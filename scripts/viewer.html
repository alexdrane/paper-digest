<!doctype html>
<meta charset="utf-8">
<title>paper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
window.MathJax = {
  tex: {inlineMath:[['$','$'],['\\(','\\)']], displayMath:[['$$','$$'],['\\[','\\]']],
        processEnvironments:true, tags:'ams'},
  options:{skipHtmlTags:['script','noscript','style','textarea','pre']},
  chtml:{scale:0.96}
};
</script>
<style>
:root{
  --paper:#fbfaf7; --card:#fff; --ink:#1c1b19; --dim:#75726c; --faint:#a9a59d;
  --line:#e6e3dd; --rule:#d8d4cc; --accent:#9c5522; --accent-soft:#f3e6d8;
  --mark:#fbeecb; --chat:#f4f2ee; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
}
html[data-theme=dark]{
  --paper:#14141a; --card:#1b1b22; --ink:#e8e5df; --dim:#9b978e; --faint:#6d6a63;
  --line:#2c2c35; --rule:#3a3a45; --accent:#e0a05c; --accent-soft:#3a2c1c;
  --mark:#4c3d1c; --chat:#1a1a20; --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;height:100vh;display:flex;background:var(--paper);color:var(--ink);
     font:400 17px/1.72 'Source Serif 4',Georgia,serif;
     -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
#paper{font-size:17px}
.ui{font-family:Inter,system-ui,sans-serif}
kbd,code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ---------- table of contents ---------- */
#toc{flex:0 0 250px;background:var(--chat);border-right:1px solid var(--line);
     overflow-y:auto;padding:1.5rem 0 4rem;font:400 13px/1.5 Inter,system-ui,sans-serif}
#toc.hide{display:none}
#toc h6{margin:0 1.25rem .8rem;font:600 10px Inter,sans-serif;letter-spacing:.14em;
        text-transform:uppercase;color:var(--faint)}
#toc a{display:block;padding:.3rem 1.25rem .3rem 1.25rem;color:var(--dim);
       text-decoration:none;border-left:2px solid transparent;transition:.12s}
#toc a:hover{color:var(--ink);background:var(--accent-soft)}
#toc a.l2{padding-left:2.1rem;font-size:12.5px}
#toc a.l3{padding-left:2.9rem;font-size:12px;color:var(--faint)}
#toc a.on{color:var(--accent);border-left-color:var(--accent);font-weight:500;background:var(--accent-soft)}
#toc .n{color:var(--faint);margin-right:.5em;font-size:.85em}
#toc a{position:relative;display:flex;align-items:center;justify-content:space-between;gap:.4rem}
#toc a>.label{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.badges{flex:0 0 auto;display:flex;gap:.2rem}
.bdg{width:15px;height:15px;border-radius:4px;display:flex;align-items:center;justify-content:center;
     font-size:9px;line-height:1;cursor:pointer;flex:0 0 auto}
.bdg.summary{background:var(--accent-soft);color:var(--accent)}
.bdg.quiz{background:#2e7d5b26;color:#2e7d5b}
html[data-theme=dark] .bdg.quiz{background:#4caf7d33;color:#5fcb96}
.bdg.note{background:var(--rule);color:var(--dim)}
.bdg:hover{filter:brightness(0.92)}

/* ---------- paper ---------- */
#main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
#bar{flex:0 0 auto;display:flex;align-items:center;gap:.75rem;padding:.55rem 1.25rem;
     border-bottom:1px solid var(--line);background:var(--card);
     font:500 12.5px Inter,sans-serif;color:var(--dim)}
#bar .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
#bar button{background:none;border:1px solid var(--line);color:var(--dim);border-radius:6px;
            padding:.28rem .6rem;font:500 12px Inter,sans-serif;cursor:pointer;transition:.12s}
#bar button:hover{border-color:var(--accent);color:var(--accent)}
#qbtn{position:relative}
#qcount{background:var(--accent);color:#fff;border-radius:8px;font:600 10px Inter,sans-serif;
        padding:.05rem .38rem;margin-left:.3rem}
#qpanel,#graphpanel{position:absolute;top:2.6rem;right:1.25rem;z-index:70;width:340px;max-height:60vh;
        overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;
        box-shadow:var(--shadow);display:none}
#qpanel.open,#graphpanel.open{display:block}
#qpanel .empty,#graphpanel .empty{padding:1.4rem;text-align:center;color:var(--faint);font:400 12.5px Inter,sans-serif}
#graphpanel{width:360px;padding:.5rem 0}
#graphpanel .ghead{padding:.5rem .85rem .3rem;font:600 9px Inter,sans-serif;letter-spacing:.1em;
        text-transform:uppercase;color:var(--faint)}
.gnode{padding:.2rem .85rem;display:flex;align-items:baseline;gap:.4rem}
.gnode .gopen{background:none;border:0;color:var(--ink);text-align:left;cursor:pointer;padding:0;
        font:500 12.5px Inter,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gnode .gopen:hover{color:var(--accent);text-decoration:underline}
.gnode.cur .gopen{color:var(--accent)}
.gtag{flex:0 0 auto;font:600 8px Inter,sans-serif;letter-spacing:.06em;text-transform:uppercase;
        color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:.1rem .3rem}
.gedge{padding:.05rem .85rem .15rem;color:var(--faint);font:400 11px 'JetBrains Mono',monospace;
        overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow{padding:.65rem .8rem;border-bottom:1px solid var(--line);display:flex;gap:.6rem;align-items:flex-start}
.qrow:last-child{border-bottom:0}
.qrow .kind{flex:0 0 auto;font:600 9px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;
            color:var(--accent);background:var(--accent-soft);border-radius:4px;padding:.15rem .4rem;
            margin-top:.1rem}
.qrow .info{flex:1;min-width:0}
.qrow .sec{font:500 12px Inter,sans-serif;color:var(--ink);margin-bottom:.15rem;
           white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow .q{font:400 11.5px/1.4 Inter,sans-serif;color:var(--dim);
         display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.qrow .rm{flex:0 0 auto;background:none;border:1px solid var(--line);color:var(--faint);
          border-radius:5px;font:500 10px Inter,sans-serif;padding:.2rem .5rem;cursor:pointer}
.qrow .rm:hover{border-color:#b3261e;color:#b3261e}
.qrow .go{flex:0 0 auto;background:none;border:0;color:var(--faint);cursor:pointer;font-size:12px}
.qrow .go:hover{color:var(--accent)}
#bar a{color:var(--accent);text-decoration:none}
#prog{position:absolute;top:0;left:0;height:2px;background:var(--accent);width:0;
      transition:width .1s linear;z-index:30}
#paper{flex:1;overflow-y:auto;padding:3.5rem 3rem 12rem;scroll-behavior:smooth;position:relative}
.wrap{max-width:38rem;margin:0 auto}

h1{font:700 2.05rem/1.2 'Source Serif 4',Georgia,serif;margin:0 0 .9rem;letter-spacing:-.01em}
.byline{font:500 15px Inter,sans-serif;color:var(--ink);margin-bottom:.35rem}
.meta{font:400 12px 'JetBrains Mono',monospace;color:var(--faint);margin-bottom:2.6rem}
.meta a{color:var(--accent);text-decoration:none} .meta a:hover{text-decoration:underline}
.abstract{border-left:2px solid var(--accent);padding:.2rem 0 .2rem 1.4rem;margin:0 0 3.5rem;
          font-size:16px;color:var(--dim)}
.abstract b{display:block;font:600 10px Inter,sans-serif;letter-spacing:.14em;
            text-transform:uppercase;color:var(--accent);margin-bottom:.5rem}

h2,h3,h4,h5,h6{font-family:Inter,system-ui,sans-serif;line-height:1.3;
               scroll-margin-top:2rem;position:relative}
h2{font-size:1.32rem;font-weight:600;margin:3.2rem 0 .9rem;letter-spacing:-.01em}
h3{font-size:1.08rem;font-weight:600;margin:2.4rem 0 .7rem}
h4,h5,h6{font-size:.95rem;font-weight:600;margin:1.8rem 0 .5rem;color:var(--dim)}
.secnum{position:absolute;right:100%;padding-right:.9rem;color:var(--faint);
        font:400 .82em 'JetBrains Mono',monospace}
@media(max-width:1150px){.secnum{position:static;padding-right:0;margin-right:.6em}}
p{margin:0 0 1.15rem;hyphens:auto}
.wrap>.blk:first-of-type p:first-child::first-letter{font-size:1.05em}

.eq{position:relative;overflow-x:auto;overflow-y:hidden;padding:.5rem 0;margin:1.2rem 0}

figure{margin:2.4rem 0;text-align:center}
figure.wide{margin-left:-5.5rem;margin-right:-5.5rem}
@media(max-width:1500px){figure.wide{margin-left:-1.5rem;margin-right:-1.5rem}}
.panels{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center;align-items:flex-start}
.panels img{flex:1 1 340px;max-width:100%;border:1px solid var(--line);border-radius:5px;
            background:#fff;box-shadow:var(--shadow)}
.panels .figwrap{flex:1 1 340px;position:relative;display:flex}
.panels .figwrap img{flex:1 1 auto;width:100%}
.figspin{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
         background:var(--card);border:1px solid var(--line);border-radius:5px}
.figspin .spin{width:16px;height:16px;margin:0}
.figfail{font:400 11px 'JetBrains Mono',monospace;color:var(--faint)}
figcaption{font:400 13.5px/1.55 Inter,sans-serif;color:var(--dim);text-align:left;margin-top:.85rem}
figure.tbl figcaption{margin:0 0 .85rem}
.placeholder{color:var(--faint);font:400 12px 'JetBrains Mono',monospace;
             border:1px dashed var(--rule);padding:2rem;border-radius:5px}
table{border-collapse:collapse;font:400 13px/1.5 Inter,sans-serif;margin:0 auto;
      display:block;overflow-x:auto;white-space:nowrap;max-width:100%}
thead th{border-top:1.5px solid var(--ink);border-bottom:1px solid var(--rule);
         padding:.5rem .85rem;text-align:left;font-weight:600}
tbody td{padding:.42rem .85rem;text-align:left}
tbody tr.group td{border-top:1px solid var(--line)}
tbody tr:last-child td{border-bottom:1.5px solid var(--ink)}

.cite{color:var(--accent);cursor:help;font:400 .78em 'JetBrains Mono',monospace;
      padding:.05em .2em;border-radius:3px;white-space:nowrap;background:var(--accent-soft)}
.srcref{color:var(--dim);cursor:pointer;font:400 .7em 'JetBrains Mono',monospace;
        padding:.05em .3em;margin:0 .12em;border-radius:3px;white-space:nowrap;
        border:1px solid var(--rule);vertical-align:.15em;text-transform:uppercase;
        letter-spacing:.04em}
.srcref:hover{border-color:var(--accent);color:var(--accent)}
.srcref.missing{color:var(--faint);border-style:dashed;cursor:not-allowed}
@keyframes srcflash{from{background:var(--mark)}to{background:transparent}}
.blk.srcflash{animation:srcflash 1.6s ease-out;border-radius:4px}
a.xref{color:var(--accent);text-decoration:none;font-family:'JetBrains Mono',monospace;font-size:.88em}
a.xref:hover{text-decoration:underline}
.xref{color:var(--faint);font-family:'JetBrains Mono',monospace;font-size:.88em}
:target{background:var(--mark);border-radius:4px;transition:background 1.2s}
::selection{background:var(--mark)}
ul,ol{margin:0 0 1.15rem;padding-left:1.3rem} li{margin-bottom:.35rem}

.sec{position:relative;transition:opacity .15s}
.sec.dim{opacity:.32}
.secrail{position:absolute;right:100%;top:.2em;padding-right:.75rem;display:flex;
         flex-direction:column;gap:.25rem;opacity:0;transition:.15s;z-index:5}
.sec:hover .secrail,.secrail:hover,.secrail.pinned{opacity:1}
.secrail button{background:var(--card);border:1px solid var(--line);color:var(--dim);
                border-radius:5px;font:500 10px Inter,sans-serif;padding:.16rem .42rem;
                cursor:pointer;white-space:nowrap;text-align:left}
.secrail button:hover{border-color:var(--accent);color:var(--accent)}
.secrail button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
@media(max-width:1350px){.secrail{position:static;flex-direction:row;padding:0 0 .4rem;opacity:.55}}
.sec.folded .secbody{display:none}
.sec.folded>.blk h2::after{content:' …';color:var(--faint);font-weight:400}

.gap{height:1.5rem;position:relative;display:flex;align-items:center;justify-content:center}
.gap button{opacity:0;background:var(--card);border:1px dashed var(--rule);color:var(--faint);
            border-radius:14px;font:500 11px Inter,sans-serif;padding:.2rem .8rem;
            cursor:pointer;transition:.15s}
.gap:hover button{opacity:1}
.gap button:hover{border-color:var(--accent);color:var(--accent);border-style:solid}
.menu{position:absolute;z-index:50;background:var(--card);border:1px solid var(--line);
      border-radius:9px;box-shadow:var(--shadow);padding:.3rem;display:none;min-width:190px}
.menu button{display:block;width:100%;text-align:left;background:none;border:0;
             color:var(--ink);font:500 12.5px Inter,sans-serif;padding:.45rem .6rem;
             border-radius:6px;cursor:pointer}
.menu button:hover{background:var(--accent-soft);color:var(--accent)}
.menu .hint{padding:.3rem .6rem .45rem;color:var(--faint);font:400 11px Inter,sans-serif}

@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:var(--shadow)}}
.card.new{animation:flash 1.4s ease-out}
@keyframes docswap{0%{opacity:0;transform:translateY(8px)}100%{opacity:1;transform:none}}
#doc.switching{animation:docswap .4s ease-out}
.card.summary{margin:.2rem 0 1.4rem}
.sec.folded>.card{margin-bottom:1.6rem}
.secrail button.has{border-color:var(--accent);color:var(--accent)}
.card{border:1px solid var(--line);border-radius:10px;background:var(--card);
      box-shadow:var(--shadow);margin:1rem 0;overflow:hidden}
.card>h6{margin:0;padding:.55rem .9rem;background:var(--accent-soft);color:var(--accent);
         font:600 9.5px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;
         display:flex;justify-content:space-between;align-items:center;gap:.6rem}
.card>h6 .ct{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.card>h6 button{flex:0 0 auto;background:none;border:0;color:var(--accent);cursor:pointer;
                font:500 10px Inter,sans-serif;opacity:.75}
.card>h6 button:hover{opacity:1}
.cardbody{padding:.9rem 1.1rem;font:400 14.5px/1.62 Inter,sans-serif}
.cardbody p{margin:0 0 .7rem}.cardbody p:last-child{margin:0}
.cardbody ul,.cardbody ol{margin:0 0 .7rem;padding-left:1.2rem}

.qz{margin-bottom:1.4rem}.qz:last-child{margin-bottom:0}
.qz .qtext{font-weight:500;margin-bottom:.6rem}
.qz .opt{display:block;width:100%;text-align:left;background:var(--paper);
         border:1px solid var(--line);border-radius:7px;padding:.5rem .7rem;margin-bottom:.35rem;
         font:400 13.5px Inter,sans-serif;color:var(--ink);cursor:pointer;transition:.12s}
.qz .opt:hover{border-color:var(--accent)}
.qz .opt.right{background:#2e7d5b1a;border-color:#2e7d5b;color:#2e7d5b;font-weight:500}
.qz .opt.wrong{background:#b3261e1a;border-color:#b3261e;color:#b3261e}
.qz .opt:disabled{cursor:default}
.qz textarea{width:100%;min-height:4.2rem;border:1px solid var(--line);border-radius:7px;
             padding:.5rem .7rem;font:400 13.5px Inter,sans-serif;background:var(--paper);
             color:var(--ink);resize:vertical;outline:none}
.qz textarea:focus{border-color:var(--accent)}
.qz .reveal{margin-top:.4rem;background:none;border:1px solid var(--line);border-radius:6px;
            color:var(--dim);font:500 11px Inter,sans-serif;padding:.25rem .6rem;cursor:pointer}
�.qz .reveal:hover{border-color:var(--accent);color:var(--accent)}
.qz .btnrow{display:flex;gap:.5rem;margin-top:.4rem}
.qz .grade{background:var(--accent);color:#fff;border:0;border-radius:6px;
           font:600 11px Inter,sans-serif;padding:.3rem .7rem;cursor:pointer}
.qz .grade:hover{filter:brightness(1.08)}
.qz .grade:disabled{opacity:.55;cursor:default}
.gr{margin-top:.55rem;padding:.55rem .75rem;border-radius:6px;font-size:13px;line-height:1.55;
    border-left:2px solid var(--faint)}
.gr.correct{background:#2e7d5b1a;border-color:#2e7d5b}
.gr.partial{background:#b8860b1a;border-color:#b8860b}
.gr.incorrect{background:#b3261e1a;border-color:#b3261e}
.gr .verdict{font:600 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;
             display:block;margin-bottom:.3rem}
.gr.correct .verdict{color:#2e7d5b} .gr.partial .verdict{color:#b8860b} .gr.incorrect .verdict{color:#b3261e}
.qz .why{margin-top:.5rem;padding:.5rem .7rem;border-left:2px solid var(--accent);
         background:var(--accent-soft);border-radius:0 6px 6px 0;font-size:13px;display:none}
.note textarea{width:100%;min-height:4rem;border:0;outline:none;resize:vertical;
               background:none;color:var(--ink);font:400 14px/1.6 Inter,sans-serif}
#selbar{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%);z-index:60;
        background:var(--ink);color:var(--paper);border-radius:22px;padding:.5rem .5rem .5rem 1rem;
        display:none;align-items:center;gap:.6rem;box-shadow:0 6px 24px rgba(0,0,0,.3);
        font:500 12.5px Inter,sans-serif}
#selbar button{background:var(--accent);color:#fff;border:0;border-radius:16px;
               padding:.35rem .85rem;font:600 12px Inter,sans-serif;cursor:pointer}
#selbar .x{background:none;color:var(--paper);opacity:.6;padding:.35rem .5rem}
.htools{position:absolute;right:100%;top:.15em;padding-right:.5rem;display:flex;
        gap:.3rem;opacity:0;transition:.15s;white-space:nowrap}
h2:hover .htools,h3:hover .htools,.htools:hover{opacity:1}
.htools button{background:var(--card);border:1px solid var(--line);color:var(--dim);
               border-radius:5px;font:500 10px Inter,sans-serif;padding:.15rem .4rem;cursor:pointer}
.htools button:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:1350px){.htools{position:static;padding:0 0 0 .6rem;opacity:.5;display:inline-flex}}
h2[data-collapsed='1'],h3[data-collapsed='1']{opacity:.62}
h2[data-collapsed='1']::after,h3[data-collapsed='1']::after{
  content:' …';color:var(--faint);font-weight:400}
.summary{background:var(--accent-soft);border-radius:8px;padding:.85rem 1.1rem;
         margin:.2rem 0 1.6rem;font:400 14px/1.6 Inter,sans-serif;color:var(--ink);
         border-left:2px solid var(--accent)}
.summary::before{content:'Summary';display:block;font:600 9px Inter,sans-serif;
                 letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:.4rem}
.summary p{margin:0 0 .6rem}.summary p:last-child{margin:0}
.summary ul,.summary ol{margin:0 0 .6rem;padding-left:1.1rem}
#lightbox{position:fixed;inset:0;background:rgba(8,8,10,.94);z-index:100;display:none;
          align-items:center;justify-content:center;cursor:zoom-out}
#lightbox img{max-width:96vw;max-height:92vh;transform-origin:center;transition:transform .12s;
              background:#fff;border-radius:4px}
#lbhint{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);color:#bbb;
        font:500 12px Inter,sans-serif;z-index:101;display:none}
.panels img{cursor:zoom-in}
#toast{position:fixed;bottom:1.1rem;left:50%;transform:translateX(-50%) translateY(8px);
       z-index:80;background:var(--ink);color:var(--paper);border-radius:8px;
       padding:.55rem 1rem;font:500 12.5px Inter,sans-serif;opacity:0;pointer-events:none;
       transition:.2s;box-shadow:0 6px 24px rgba(0,0,0,.3)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#selbox{position:absolute;z-index:40;display:none;background:var(--accent);border-radius:7px;
        box-shadow:0 4px 16px rgba(0,0,0,.28);overflow:visible}
#selbox::after{content:'';position:absolute;bottom:-5px;left:1.1rem;
               border:5px solid transparent;border-top-color:var(--accent);border-bottom:0}
#selbox .row{display:flex;align-items:stretch;border-radius:7px;overflow:hidden}
#askbtn{border:0;background:none;color:#fff;padding:.42rem .8rem;font:600 12px Inter,sans-serif;
        cursor:pointer;white-space:nowrap}
#askbtn:hover{background:rgba(255,255,255,.12)}
#flagbtn{border:0;background:none;color:#fff;opacity:.62;padding:.42rem .6rem;
         font:600 12px Inter,sans-serif;cursor:pointer;border-left:1px solid rgba(255,255,255,.28)}
#flagbtn:hover{opacity:1;background:rgba(0,0,0,.15)}

/* ---------- side ---------- */
#grip{flex:0 0 5px;cursor:col-resize;background:var(--line)}
#grip:hover{background:var(--accent)}
#side{flex:0 0 340px;min-width:280px;max-width:520px;border-left:1px solid var(--line);
      background:var(--chat);display:flex;flex-direction:column}
#head{padding:.75rem 1rem;border-bottom:1px solid var(--line);display:flex;
      justify-content:space-between;align-items:center;
      font:600 10px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--faint)}
#head button{background:none;border:0;color:var(--faint);font:500 11px Inter,sans-serif;
             cursor:pointer;text-transform:none;letter-spacing:0}
#head button:hover{color:var(--accent)}
#log{flex:1;overflow-y:auto;padding:1.25rem;font:400 14.5px/1.62 Inter,system-ui,sans-serif}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/3.2.2/es5/tex-mml-chtml.min.js"></script>
<script>
let PAPER=null, sel={text:'',section:'',keys:[]};
const jobCards=new Map();  // job id -> card element (only while pending)
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* theme */
const savedTheme=localStorage.getItem('pd-theme');
if(savedTheme) document.documentElement.dataset.theme=savedTheme;
else if(matchMedia('(prefers-color-scheme:dark)').matches) document.documentElement.dataset.theme='dark';
function toggleTheme(){
  const d=document.documentElement.dataset.theme==='dark';
  document.documentElement.dataset.theme=d?'light':'dark';
  localStorage.setItem('pd-theme',d?'light':'dark');
}

let CURRENT='';
function renderPaperDoc(p){
  const isSwitch = CURRENT && CURRENT!==p.arxiv_id;
  PAPER=p; CURRENT=p.arxiv_id;
  try{localStorage.setItem('pd-last',p.arxiv_id);}catch(e){}
  document.title=p.title;
  setSaveBtn(!!p.saved);
  picked.clear(); $('selbar').style.display='none';
  // MathJax has no package system: supply the commands papers get from packages,
  // then the paper's own \newcommands (which win on a name clash).
  const FALLBACK={
    bm:['\\boldsymbol{#1}',1], bs:['\\boldsymbol{#1}',1],
    vec:['\\mathbf{#1}',1], mathbbm:['\\mathbb{#1}',1],
    si:['\\mathrm{#1}',1], num:['#1',1], SI:['#1\\,\\mathrm{#2}',2],
    argmin:['\\operatorname*{arg\\,min}',0], argmax:['\\operatorname*{arg\\,max}',0],
    Tr:['\\operatorname{Tr}',0], tr:['\\operatorname{tr}',0],
    diag:['\\operatorname{diag}',0], erf:['\\operatorname{erf}',0],
    sgn:['\\operatorname{sgn}',0], indep:['\\perp\\!\\!\\!\\perp',0]
  };
  const own=p.macros||{};
  const table=Object.fromEntries(
    Object.entries(FALLBACK).filter(([n])=>!(n in own)).concat(Object.entries(own)));
  const defs=Object.entries(table).map(([n,v])=>
    Array.isArray(v)?`\\newcommand{\\${n}}[${v[1]}]{${v[0]}}`:`\\newcommand{\\${n}}{${v}}`).join('');
  $('doc').innerHTML=
    (defs?`<div style="display:none">\\(${defs}\\)</div>`:'')
    +`<h1>${p.title}</h1><div class="byline">${p.authors.join(' · ')}</div>
      <div class="meta"><a href="${p.abs_url}" target="_blank">arXiv:${p.arxiv_id}</a>
        · ${Object.keys(p.bib).length} references · rendered from ${p.source}</div>
      <div class="abstract"><b>Abstract</b>${p.abstract}</div>`
    +p.blocks.map(b=>`<div class="blk" data-id="${b.id}" data-sec="${esc(b.section)}">${b.html}</div>`).join('');
  $('stat').textContent=`${p.blocks.length} blocks`;
  if(isSwitch){
    $('paper').scrollTo({top:0,behavior:'smooth'});
    const d=$('doc'); d.classList.remove('switching'); void d.offsetWidth; d.classList.add('switching');
  }
  wrapFigures();
  // Full re-typeset of #doc. MathJax keeps its typeset-root list and (with
  // tags:'ams') an \label registry across typesetPromise() calls, so switching
  // away from a paper and back makes every \label read as "multiply defined"
  // and its \eqref render as ??. Drop the stale roots and reset the label /
  // equation-number state before typesetting the fresh document.
  if(typeof MathJax.typesetClear==='function') MathJax.typesetClear([$('doc')]);
  if(typeof MathJax.texReset==='function') MathJax.texReset();
  MathJax.typesetPromise([$('doc')]).then(()=>{buildSections();buildTOC();decorateHeadings();loadState();});
  document.querySelectorAll('.cite').forEach(c=>{
    c.title=c.dataset.keys.split(',').map(k=>PAPER.bib[k]||k).join('\n\n');
    c.onclick=e=>{e.stopPropagation();openCitePopover(e,c);};
  });
  refreshLibrary();
}
/* First view of a PDF/EPS/PS figure runs an on-demand server-side conversion
   (pdftoppm/ghostscript) that can take a second or two - show a spinner over
   each figure until its <img> load/error fires. */
function wrapFigures(){
  $('doc').querySelectorAll('.panels img').forEach(img=>{
    if(img.closest('.figwrap')) return;
    const w=document.createElement('span');
    w.className='figwrap';
    img.replaceWith(w); w.appendChild(img);
    if(img.complete && img.naturalWidth>0) return;
    const s=document.createElement('span');
    s.className='figspin'; s.innerHTML='<span class="spin"></span>';
    w.appendChild(s);
    const done=()=>s.remove();
    const fail=()=>{s.innerHTML='<span class="figfail">figure failed to render</span>';};
    img.addEventListener('load',done,{once:true});
    img.addEventListener('error',fail,{once:true});
    // The load/error event can fire in the gap between the complete check above
    // and these listeners being attached (a cached figure served instantly, plus
    // the reparent) - {once:true} means we'd then never hear it and the opaque
    // spinner sits forever over a fine image. Re-check synchronously.
    if(img.complete) (img.naturalWidth>0?done:fail)();
  });
}

/* Native <select> options can't ellipsis via CSS - truncate the string. */
function trunc(s,n){s=String(s||'');return s.length>n?s.slice(0,n-1).trimEnd()+'…':s;}

/* A bare /paper resolves to the launch paper server-side, so a plain refresh
   while viewing a citation-opened paper would snap back to it (and its pending
   queue items would stop showing). Reopen whatever was last viewed. */
(function loadInitialPaper(){
  let last=null;
  try{last=localStorage.getItem('pd-last');}catch(e){}
  const first=last?fetch('/paper?id='+encodeURIComponent(last)).then(r=>r.ok?r.json():Promise.reject()):Promise.reject();
  first.catch(()=>fetch('/paper').then(r=>r.json())).then(renderPaperDoc);
})();

/* ---- save / star the open paper ---- */
function setSaveBtn(on){
  const b=$('savebtn'); if(!b) return;
  b.classList.toggle('on',on);
  b.textContent=on?'★':'☆';
  b.title=on?'Saved for later — click to remove':'Save this paper for later';
}
function toggleSave(){
  const on=$('savebtn').classList.contains('on');
  fetch(on?'/unsave':'/save',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:CURRENT,title:PAPER&&PAPER.title})})
   .then(r=>r.json()).then(res=>{
     setSaveBtn(!!res.saved);
     toast(res.saved?'Saved for later':'Removed from saved');
     refreshLibrary();
   }).catch(()=>toast('Could not update the saved list'));
}

/* ---- multiple papers open at once ---- */
function refreshLibrary(){
  fetch('/library').then(r=>r.json()).then(({papers})=>{
    const sel=$('paperSelect');
    sel.innerHTML=papers.map(p=>
      `<option value="${p.id}"${p.id===CURRENT?' selected':''}>${esc(trunc(p.title||p.id,52))}</option>`).join('');
    sel.style.display=papers.length>1?'block':'none';
  });
}
function switchPaper(id){
  if(id===CURRENT) return;
  fetch('/paper?id='+encodeURIComponent(id)).then(r=>r.json()).then(renderPaperDoc);
}
$('paperSelect').addEventListener('change',e=>switchPaper(e.target.value));

/* Append a citation's reconstructed BibTeX entry to references.bib — works for
   citations that never resolve on arXiv (the case this is really for), building
   from the citing paper's own parsed bibliography fields when there's no match. */
function bibBtn(key,match){
  const b=document.createElement('button');
  b.className='bibsave';
  b.textContent='☆ bib';
  b.title='Append this reference to your references.bib';
  b.onclick=ev=>{
    ev.stopPropagation();
    b.disabled=true;
    fetch('/savebib',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({from_id:CURRENT,key,match:match?{arxiv_id:match.arxiv_id,
        title:match.title,authors:match.authors,year:match.year}:null})})
     .then(r=>r.json()).then(res=>{
       if(res.error){b.disabled=false;toast('Could not save reference: '+res.error);return;}
       b.textContent=res.already?`★ bib (${res.key})`:`★ bib → ${res.key}`;
       toast(res.already?`Already in references.bib as ${res.key}`
                        :`Added ${res.key} to references.bib`);
     })
     .catch(()=>{b.disabled=false;toast('Could not save reference');});
  };
  return b;
}

/* ---- citation click: resolve on arXiv, open alongside the current paper ---- */
function openCitePopover(e,cite){
  const keys=cite.dataset.keys.split(',');
  const m=$('menu');
  m.innerHTML='<div class="hint">'+keys.length+' work'+(keys.length>1?'s':'')+' cited here</div>'
    +keys.map(k=>`<div class="citerow" data-k="${esc(k)}">
        <div class="ctitle">${esc((PAPER.bib||{})[k]||k)}</div>
        <div class="cstatus">searching arXiv…</div></div>`).join('');
  m.style.display='block';
  const r=cite.getBoundingClientRect();
  m.style.top=(r.bottom+6)+'px'; m.style.left=Math.max(8,Math.min(innerWidth-360,r.left))+'px';
  fetch('/resolve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({from_id:CURRENT,keys})})
   .then(r=>r.json()).then(res=>{
     keys.forEach(k=>{
       const row=m.querySelector(`.citerow[data-k="${CSS.escape(k)}"] .cstatus`);
       if(!row) return;
       const hit=res[k]&&res[k].match;
       if(!hit){
         row.innerHTML='<span class="cnote">not found on arXiv</span>';
         row.appendChild(bibBtn(k,null));
         return;
       }
       row.innerHTML=`<button class="openin">Open arXiv:${hit.arxiv_id} in reader →</button>`
                    +`<button class="star" title="Save to your list without switching to it">☆ save</button>`;
       row.appendChild(bibBtn(k,hit));
       row.querySelector('.star').onclick=(ev)=>{
         ev.stopPropagation();
         const s=ev.currentTarget; s.disabled=true;
         fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},
           body:JSON.stringify({id:hit.arxiv_id,title:hit.title,via:CURRENT})})
          .then(r=>r.json()).then(()=>{s.textContent='★ saved';
            if(hit.arxiv_id===CURRENT) setSaveBtn(true);
            refreshLibrary(); toast(`Saved arXiv:${hit.arxiv_id}`);})
          .catch(()=>{s.disabled=false; toast('Could not save it');});
       };
       row.querySelector('.openin').onclick=(ev)=>{
         ev.stopPropagation();   // else the document-level click-away listener
                                 // closes this popover on the same click, and
                                 // the fetch below runs with no visible sign of it
         m.querySelectorAll('.openin').forEach(b=>b.disabled=true);
         row.innerHTML=`<span class="spin"></span>fetching arXiv:${hit.arxiv_id}`
                      +` — can take up to a minute for a large paper…`;
         fetch('/open',{method:'POST',headers:{'Content-Type':'application/json'},
           body:JSON.stringify({id:hit.arxiv_id, from_id:CURRENT,
             section:cite.closest('.blk')?.dataset.sec||'', keys:[k]})})
          .then(r=>r.ok?r.json():r.json().then(e=>Promise.reject(e.error||'failed')))
          .then(doc=>{
            m.style.display='none';
            renderPaperDoc(doc);
            toast(`Opened arXiv:${hit.arxiv_id}`);
          })
          .catch(err=>{
            row.innerHTML=`<span class="err cstatus">Couldn't open it: ${esc(String(err))}</span>`;
            m.querySelectorAll('.openin').forEach(b=>b.disabled=false);
          });
       };
     });
   });
}

/* ---- contents + scroll spy ---- */
function buildTOC(){
  const hs=[...document.querySelectorAll('#doc h2,#doc h3,#doc h4')];
  $('toclist').innerHTML=hs.map(h=>{
    const lvl=+h.tagName[1]-1, num=h.querySelector('.secnum')?.textContent||'';
    const txt=h.textContent.replace(num,'').trim();
    return `<a href="#${h.id}" class="l${lvl}" data-t="${h.id}">
              <span class="label">${num?`<span class="n">${num}</span>`:''}${esc(txt)}</span>
              <span class="badges"></span></a>`;
  }).join('');
  syncTOC();
  const links=new Map([...$('toclist').querySelectorAll('a')].map(a=>[a.dataset.t,a]));
  const io=new IntersectionObserver(es=>{
    es.forEach(e=>{
      if(!e.isIntersecting) return;
      links.forEach(a=>a.classList.remove('on'));
      const a=links.get(e.target.id);
      if(a){a.classList.add('on'); a.scrollIntoView({block:'nearest'});
            $('crumb').textContent=a.textContent.trim();}
    });
  },{rootMargin:'0px 0px -80% 0px'});
  hs.forEach(h=>io.observe(h));
}

/* which heading an inserted block "belongs to": the last h2/h3 that precedes it */
function nearestHeadingId(el){
  const heads=[...document.querySelectorAll('#doc h2,#doc h3')];
  let best=null;
  for(const h of heads){
    if(h.compareDocumentPosition(el)&Node.DOCUMENT_POSITION_FOLLOWING) best=h; else break;
  }
  return best?best.id:null;
}
function syncTOC(){
  const marks=new Map();
  const mark=(el,kind)=>{
    const id=nearestHeadingId(el); if(!id) return;
    (marks.get(id)||marks.set(id,new Set()).get(id)).add(kind);
  };
  document.querySelectorAll('.card').forEach(c=>mark(c,c.dataset.kind));
  document.querySelectorAll('.summary').forEach(s=>{if(!s.closest('.card')) mark(s,'summary');});
  const icons={quiz:'Q',summary:'S',note:'N'}, labels={quiz:'Quiz',summary:'Summary',note:'Note'};
  document.querySelectorAll('#toclist a').forEach(a=>{
    const ks=marks.get(a.dataset.t), b=a.querySelector('.badges');
    b.innerHTML=ks?[...ks].sort().map(k=>
      `<span class="bdg ${k}" title="${labels[k]}">${icons[k]}</span>`).join(''):'';
    b.querySelectorAll('.bdg').forEach(el=>el.onclick=e=>{
      e.preventDefault(); e.stopPropagation(); jumpToBlock(a.dataset.t,el.classList[1]);
    });
  });
}
function jumpToBlock(headingId,kind){
  const hit=[...document.querySelectorAll('.card,.summary')].find(el=>{
    if(el.classList.contains('card')&&el.dataset.kind!==kind) return false;
    if(!el.classList.contains('card')&&kind!=='summary') return false;
    return nearestHeadingId(el)===headingId;
  });
  hit?.scrollIntoView({behavior:'smooth',block:'center'});
}
$('paper').addEventListener('scroll',e=>{
  const t=e.target;
  $('prog').style.width=(t.scrollTop/(t.scrollHeight-t.clientHeight)*100)+'%';
});

/* ---- selection ---- */
const box=$('selbox'), btn=$('askbtn'), flagbtn=$('flagbtn');
$('paper').addEventListener('mouseup',()=>{
  const s=window.getSelection(), t=s.toString().trim();
  if(t.length<3){box.style.display='none';return;}
  const r=s.getRangeAt(0), rect=r.getBoundingClientRect();
  let node=r.commonAncestorContainer;
  if(node.nodeType===3) node=node.parentElement;
  const blk=node.closest?.('.blk'), keys=[];
  if(blk) blk.querySelectorAll('.cite').forEach(c=>{
    if(r.intersectsNode(c)) keys.push(...c.dataset.keys.split(','));
  });
  sel={text:t, section:blk?.dataset.sec||'', keys:[...new Set(keys)], blockId:blk?.dataset.id||''};
  box.style.display='block';
  box.style.top=(rect.top-42)+'px';
  box.style.left=Math.max(8,rect.left+rect.width/2-58)+'px';
});
document.addEventListener('mousedown',e=>{
  if(!e.target.closest('#selbox')) box.style.display='none';
});
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2600);
}
flagbtn.onclick=()=>{
  box.style.display='none';
  const note=prompt('What\'s broken about this? (optional \u2013 Cancel to skip the report)','');
  if(note===null) return;
  const block=(PAPER.blocks||[]).find(b=>b.id===sel.blockId);
  fetch('/flag',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:CURRENT, section:sel.section, block_id:sel.blockId,

/* ---- unwrap hand-wrapped prose ----
   marked runs with breaks:true, so every single \n becomes a <br>. An answer
   written to a bridge reply file at a fixed column then renders as one choppy
   line per wrap. Collapse single newlines back to spaces so a paragraph is
   defined by a blank line, not by how the source happened to be wrapped -
   while leaving list items, blockquotes, headings, tables, fenced/indented
   code and explicit two-space hard breaks alone. */
function unwrapProse(src){
  const blocks=[];
  let s=src.replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g,m=>{blocks.push(m);return `@@C${blocks.length-1}@@`;});
  const lines=s.split('\n');
  const structural=/^\s*(?:[-*+]\s|\d+[.)]\s|>|#{1,6}\s|\||@@C\d+@@)/;
  const out=[];
  for(let i=0;i<lines.length;i++){
    out.push(lines[i]);
    const nxt=lines[i+1];
    if(nxt===undefined) break;
    const join = lines[i].trim()!=='' && nxt.trim()!=='' &&
      !structural.test(lines[i]) && !structural.test(nxt) &&
      !/ {2}$/.test(lines[i]) && !/^\s{4,}/.test(nxt);
    out.push(join?' ':'\n');
  }
  return out.join('').replace(/@@C(\d+)@@/g,(_,i)=>blocks[+i]);
}

/* ---- markdown with maths kept intact ---- */
function md(text){
  text=unwrapProse(text);
  const keep=[];
  const stash=s=>s.replace(/\$\$[\s\S]*?\$\$|\\\[[\s\S]*?\\\]|\$[^$\n]+?\$|\\\([\s\S]*?\\\)/g,
                           m=>{keep.push(m);return `@@M${keep.length-1}@@`;});
  const refs=[];
  let staged=stash(text).replace(/\[\[(b\d+)\]\]/g,(_,id)=>{refs.push(id);return `@@S${refs.length-1}@@`;});
  let out=marked.parse(staged,{breaks:true});
  out=out.replace(/@@M(\d+)@@/g,(_,i)=>keep[+i]);
  out=out.replace(/@@S(\d+)@@/g,(_,i)=>sourceRefChip(refs[+i]));
  return out;
}

/* ---- [[bNN]] source-citation markers in Claude's answers ----
   An answering session grounds a claim by writing [[b12]], the id of the paper
   block it came from (find ids with `bridge.py blocks <id> [term]`). We turn it
   into a hoverable/clickable chip: the tooltip is that block's source text, a
   click scrolls the paper to it. Distinct from `.cite` (which points at bib
   keys and opens the arXiv popover) - this points at PAPER.blocks. */
function blockSourceText(b){
  if(!b) return '';
  const t=(b.raw||'').trim() || String(b.html||'').replace(/<[^>]+>/g,' ');
  return t.replace(/\s+/g,' ').trim();
}
function sourceRefChip(id){
  const b=(PAPER.blocks||[]).find(x=>x.id===id);
  if(!b) return `<span class="srcref missing" title="no block ${esc(id)} in this paper">${esc(id)}</span>`;
  let src=blockSourceText(b);
  if(src.length>400) src=src.slice(0,400)+'…';
  const sec=b.section&&b.section!=='(front matter)'?b.section+' — ':'';
  return `<span class="srcref" data-bid="${esc(id)}" title="${esc(sec+src)}">src</span>`;
}
document.addEventListener('click',e=>{
  const r=e.target.closest?.('.srcref[data-bid]'); if(!r) return;
  e.preventDefault(); e.stopPropagation();
  const blk=document.querySelector(`.blk[data-id="${CSS.escape(r.dataset.bid)}"]`);
  if(!blk){toast(`block ${r.dataset.bid} is not in the rendered paper`);return;}
  const sec=blk.closest('.sec');
  if(sec&&sec.classList.contains('folded')) sec.querySelector('.secrail .fd')?.click();
  blk.scrollIntoView({behavior:'smooth',block:'center'});
  blk.classList.remove('srcflash'); void blk.offsetWidth; blk.classList.add('srcflash');
});

function refreshGraph(){
  fetch('/citation-graph').then(r=>r.json()).then(({nodes,edges,start})=>{
    const p=$('graphpanel');
    if(!edges.length){
      p.innerHTML='<div class="empty">No citation trail yet.<br>'
        +'Open a paper by clicking one of its citations and the path shows up here.</div>';
      return;
    }
    const node=id=>nodes.find(n=>n.id===id)||{id,title:id};
    const out=new Map();                        // citing id -> [edge,...]
    edges.forEach(ed=>{(out.get(ed.from)||out.set(ed.from,[]).get(ed.from)).push(ed);});
    const cited=new Set(edges.map(ed=>ed.to));
    // entry points: papers that cite something but nothing led you to them
    let starts=nodes.filter(n=>out.has(n.id)&&!cited.has(n.id));
    if(!starts.length) starts=nodes.filter(n=>out.has(n.id));   // pure cycle fallback
    const drawn=new Set();
    let html='';
    const walk=(id,depth)=>{
      const n=node(id);
      html+=`<div class="gnode${id===CURRENT?' cur':''}" style="padding-left:${.85+depth*.9}rem">`
           +`<button class="gopen" data-id="${esc(id)}" title="${esc(n.title||id)}">${esc(n.title||id)}</button>`
           +(id===start?'<span class="gtag">start</span>':'')
           +(n.saved?'<span class="gtag">★</span>':'')+'</div>';
      drawn.add(id);
      for(const ed of (out.get(id)||[])){
        const via=ed.section||(ed.keys||[]).join(', ')||'citation';
        html+=`<div class="gedge" style="padding-left:${.85+depth*.9+.7}rem" title="${esc(via)}">↳ ${esc(via)}</div>`;
        if(drawn.has(ed.to)){
          html+=`<div class="gnode" style="padding-left:${.85+(depth+1)*.9}rem">`
               +`<button class="gopen" data-id="${esc(ed.to)}">${esc(node(ed.to).title||ed.to)}</button>`
               +'<span class="gtag">↑ above</span></div>';
        } else if(depth<8){
          walk(ed.to,depth+1);
        }
      }
    };
    starts.forEach(n=>{ if(!drawn.has(n.id)) walk(n.id,0); });
    // papers opened directly (no citation in or out)
    const orphans=nodes.filter(n=>!drawn.has(n.id));
    p.innerHTML='<div class="ghead">citation trail</div>'+html
      +(orphans.length?'<div class="ghead">opened directly</div>'
        +orphans.map(n=>`<div class="gnode${n.id===CURRENT?' cur':''}" style="padding-left:.85rem">`
          +`<button class="gopen" data-id="${esc(n.id)}" title="${esc(n.title||n.id)}">${esc(n.title||n.id)}</button>`
          +(n.id===start?'<span class="gtag">start</span>':'')+'</div>').join(''):'');
    p.querySelectorAll('.gopen').forEach(b=>b.onclick=()=>graphOpen(b.dataset.id));
  });
}

function buildSections(){

/* ---- cards: quiz / summary / note ---- */
function cardShell(kind,title){
  const el=document.createElement('div');
  el.className='card '+kind; el.dataset.kind=kind;
  el.innerHTML=`<h6><span class="ct" title="${esc(title)}">${esc(title)}</span>`
              +`<button class="rm">remove</button></h6><div class="cardbody"></div>`;
  el.querySelector('.rm').onclick=()=>{el.remove();saveState();syncTOC();};
  return el;
}
function addCard(sec,kind,content,names,restoring){
  const titles={quiz:'Quiz',summary:'Summary',note:'Note'};
  const many=names&&names.length>1;
  const el=cardShell(kind,titles[kind]
    +(many?` · ${names.length} sections`:` · ${sec.dataset.name}`));
  const body=el.querySelector('.cardbody');
  el.dataset.sections=JSON.stringify(names||[sec.dataset.name]);
  el.dataset.anchor=sec.dataset.anchor;
  // a summary belongs under the heading it describes; quizzes follow the section
  el.dataset.place=(kind==='summary'&&!many)?'top':'bottom';
  if(kind==='note'){
    body.innerHTML='<div class="note"><textarea placeholder="Your note…"></textarea></div>';
    const ta=body.querySelector('textarea');
    ta.value=content||'';
    ta.addEventListener('input',()=>{el.dataset.raw=ta.value;});
    ta.addEventListener('blur',saveState);
  }else{
    el.dataset.raw=content||'';
    body.innerHTML=content
      ? (kind==='quiz'?'':md(content))
      : '<span class="thinking">queued for your Claude window</span>';
    if(!content) el.querySelector('h6').insertAdjacentHTML('afterbegin','');
    if(content&&kind==='quiz') renderQuiz(body,content,names);
    if(content&&kind!=='quiz') MathJax.typesetPromise([body]);
  }
  if(el.dataset.place==='top'){
    // h2 sections wrap a .secbody to insert before; a subsection heading's own
    // .blk has none, so top and bottom placement both just mean "right after it"
    const bodyw=sec.querySelector('.secbody');
    bodyw?bodyw.before(el):sec.after(el);
  }else{
    (sec.nextElementSibling?.classList.contains('gap')
      ? sec.nextElementSibling : sec).after(el);
  }
  if(sec.classList.contains('sec')) markRail(sec);
  if(!restoring){
    el.classList.add('new');
    setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),60);
    setTimeout(()=>el.classList.remove('new'),1600);
  }
  saveState();
  syncTOC();
  return el;
}
function markRail(sec){
  const kinds=new Set([...sec.querySelectorAll(':scope > .card')].map(c=>c.dataset.kind));
  let n=sec.nextElementSibling;
  while(n&&(n.classList.contains('gap')||n.classList.contains('card'))){
    if(n.classList.contains('card')) kinds.add(n.dataset.kind);
    n=n.nextElementSibling;
  }
  sec.querySelector('.secrail .su')?.classList.toggle('has',kinds.has('summary'));
  sec.querySelector('.secrail .qu')?.classList.toggle('has',kinds.has('quiz'));
}
function requestCard(sec,kind,names){
  const el=addCard(sec,kind,'',names);
  el.scrollIntoView({behavior:'smooth',block:'center'});
  const body=el.querySelector('.cardbody');
  const q=kind==='quiz'
    ? `Write a short quiz on: ${names.join('; ')}. Follow the QUIZ FORMAT exactly.`
    : `Summarise: ${names.join('; ')}. What it establishes, the mechanism, and any `
      +`assumption it quietly relies on. 3-5 sentences, no preamble.`;
  fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:CURRENT,kind,question:q,sections:names,section:names[0]})})
   .then(r=>r.json()).then(({job})=>{
     jobCards.set(job,el); el.dataset.job=job; refreshQueue();
     streamJob(job,txt=>{
       el.dataset.raw=txt;
       if(kind==='quiz'){body.innerHTML='';renderQuiz(body,txt,names);}
       else{body.innerHTML=md(txt);MathJax.typesetPromise([body]);}
       jobCards.delete(job); refreshQueue();
       saveState();
     },msg=>{body.innerHTML=`<span class="thinking">${msg}</span>`;});
   });
}

/* A dropped connection (e.g. the answering session restarted) does not mean the
   answer is lost - reconnect with backoff and keep asking until it shows up. */
function streamJob(job,onDone,onWaiting){
  let tries=0;
  const attempt=()=>{
    const es=new EventSource('/stream/'+job);
    let got=false;
    es.onmessage=e=>{got=true;onDone(JSON.parse(e.data).text);es.close();};
    es.addEventListener('waiting',ev=>{
      tries=0; onWaiting(`waiting for your Claude window \u00b7 ${JSON.parse(ev.data).seconds}s`);});
    es.addEventListener('done',()=>es.close());
    es.onerror=()=>{
      es.close();
      if(got) return;
      tries++;
      if(tries>60){onWaiting('lost the connection - reopen the queue to check status');return;}
      onWaiting('reconnecting…');
      setTimeout(attempt,Math.min(5000,500*tries));
    };
  };
  attempt();
}

/* ---- quiz parsing: ?? question / ( ) wrong / (*) right / > explanation ---- */
function parseQuiz(text){
  const qs=[]; let cur=null;
  text.split('\n').forEach(line=>{
    const q=line.match(/^\s*\?\?\s*(.+)$/);
    const o=line.match(/^\s*\(([* ])\)\s*(.+)$/);
    const w=line.match(/^\s*>\s?(.*)$/);
    if(q){cur={q:q[1],opts:[],why:[]};qs.push(cur);}
    else if(o&&cur) cur.opts.push({right:o[1]==='*',text:o[2]});
    else if(w&&cur) cur.why.push(w[1]);
    else if(cur&&line.trim()&&cur.opts.length===0&&cur.why.length===0) cur.q+=' '+line.trim();
  });
  return qs;
}
function renderQuiz(body,text,sections){
  const qs=parseQuiz(text);
  if(!qs.length){body.innerHTML=md(text);MathJax.typesetPromise([body]);return;}
  qs.forEach((item,i)=>{
    const d=document.createElement('div'); d.className='qz';
    d.innerHTML=`<div class="qtext">${i+1}. ${esc(item.q)}</div>`;
    if(item.opts.length){
      item.opts.forEach(o=>{
        const b=document.createElement('button');
        b.className='opt'; b.textContent=o.text;
        b.onclick=()=>{
          d.querySelectorAll('.opt').forEach(x=>{
            x.disabled=true;
            if(x===b) x.classList.add(o.right?'right':'wrong');
            else if(item.opts[[...d.querySelectorAll('.opt')].indexOf(x)].right) x.classList.add('right');
          });
          const why=d.querySelector('.why'); if(why) why.style.display='block';
        };
        d.appendChild(b);
      });
    }else{
      const ta=document.createElement('textarea');
      ta.placeholder='Your answer…'; d.appendChild(ta);
      const row=document.createElement('div'); row.className='btnrow';
      const gr=document.createElement('button');
      gr.className='grade'; gr.textContent='Grade my answer';
      gr.onclick=()=>gradeAnswer(d,item,ta,gr,sections);
      const rv=document.createElement('button');
      rv.className='reveal'; rv.textContent='show model answer';
      rv.onclick=()=>{d.querySelector('.why').style.display='block';rv.remove();};
      row.appendChild(gr); row.appendChild(rv); d.appendChild(row);
    }
    if(item.why.length){
      const w=document.createElement('div'); w.className='why';
      w.innerHTML=md(item.why.join('\n')); d.appendChild(w);
    }
    body.appendChild(d);
  });
  MathJax.typesetPromise([body]);
}

/* ---- grading a free-response answer ---- */
function parseGrade(text){
  const m=text.match(/^\s*(CORRECT|PARTIAL|INCORRECT)\b[:\-\s]*/i);
  return {verdict:(m?m[1]:'partial').toLowerCase(), feedback:m?text.slice(m[0].length):text};
}
function gradeAnswer(qzEl,item,ta,gr,sections){
  const answer=ta.value.trim();
  if(!answer){ta.focus();return;}
  gr.disabled=true; gr.textContent='grading…';
  ta.disabled=true;
  const box=document.createElement('div'); box.className='gr';
  box.innerHTML='<span class="thinking">queued for your Claude window</span>';
  qzEl.appendChild(box);
  const question=`Grade a reader's answer to a quiz question. Follow the GRADE FORMAT.\n\n`
    +`Question: ${item.q}\n\nReader's answer: ${answer}\n\n`
    +(item.why.length?`Model answer, for your reference \u2013 do not just diff against it:\n${item.why.join(' ')}`:'');
  fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:CURRENT,kind:'grade',question,section:(sections||[])[0]||'',sections:sections||[]})})
   .then(r=>r.json()).then(({job})=>{
     jobCards.set(job,box); refreshQueue();
     streamJob(job,txt=>{
       const g=parseGrade(txt);
       box.className='gr '+g.verdict;
       box.innerHTML=`<span class="verdict">${g.verdict}</span>${md(g.feedback.trim())}`;
       MathJax.typesetPromise([box]);
       gr.textContent='graded'; jobCards.delete(job); refreshQueue();
     },msg=>{box.innerHTML=`<span class="thinking">${esc(msg)}</span>`;});
   });
}

/* ---- workspace persistence ---- */
let saveT=null;
function saveState(){
  clearTimeout(saveT);
  saveT=setTimeout(()=>{
    const inserts=[...document.querySelectorAll('.card')].map(c=>({
      after:c.dataset.anchor, place:c.dataset.place||'bottom',
      kind:c.dataset.kind, raw:c.dataset.raw||'',
      sections:JSON.parse(c.dataset.sections||'[]')
    })).filter(x=>x.after);
    const folded=[...document.querySelectorAll('.sec.folded')].map(s=>s.dataset.anchor);
    fetch('/state',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({id:CURRENT,inserts,folded})});
  },400);
}
function loadState(){
  fetch('/state?id='+encodeURIComponent(CURRENT)).then(r=>r.json()).then(st=>{
    (st.folded||[]).forEach(a=>{
      const s=document.querySelector(`.sec[data-anchor="${a}"]`); if(s) foldSection(s);
    });
    (st.inserts||[]).forEach(ins=>{
      const s=document.querySelector(`.sec[data-anchor="${ins.after}"]`);
      if(s) addCard(s,ins.kind,ins.raw,ins.sections,true);
    });
  });
}

/* ---- per-heading tools (subsections) ---- */
function decorateHeadings(){
  document.querySelectorAll('#doc h3').forEach(h=>{
    const t=document.createElement('span');
    t.className='htools ui';
    t.innerHTML='<button class="tg" title="Collapse">\u25be</button>'
               +'<button class="sm" title="Summarise this section">summarise</button>';
    h.appendChild(t);
    t.querySelector('.tg').onclick=e=>{e.stopPropagation();toggleSection(h);};
    t.querySelector('.sm').onclick=e=>{e.stopPropagation();summarise(h);};

    // subsections get the same "+ insert block" gap sections do, targeting this
    // h3's own .blk (it has no .secbody wrapper - addCard/markRail handle that)
    const blk=h.closest('.blk');
    blk.dataset.name=headingName(h);
    blk.dataset.anchor=h.id;
    const gap=document.createElement('div');
    gap.className='gap';
    gap.innerHTML='<button>+ insert block</button>';
    gap.querySelector('button').onclick=e=>openMenu(e,blk);
    blk.after(gap);
  });
}
function headingName(h){
  const c=h.cloneNode(true);
  c.querySelectorAll('.htools,.secrail').forEach(x=>x.remove());
  const n=c.querySelector('.secnum');
  const num=n?n.textContent.trim():'';
  if(n) n.remove();
  return (num?num+' ':'')+c.textContent.trim();
}
function sectionBlocks(h){
  const lvl=+h.tagName[1], out=[];
  let n=h.closest('.blk')?.nextElementSibling;
  while(n){
    const hh=n.querySelector?.('h2,h3,h4,h5,h6');
    if(hh && +hh.tagName[1]<=lvl) break;
    out.push(n); n=n.nextElementSibling;
  }
  return out;
}
function toggleSection(h){
  const open=h.dataset.collapsed!=='1';
  sectionBlocks(h).forEach(b=>{
    if(b.classList.contains('summary')) return;   // summaries stay visible
    b.style.display=open?'none':'';
  });
  h.dataset.collapsed=open?'1':'';
  h.querySelector('.tg').textContent=open?'\u25b8':'\u25be';
}
function summarise(h){
  const name=headingName(h);
  let box=h.closest('.blk').nextElementSibling;
  if(!box||!box.classList.contains('summary')){
    box=document.createElement('div'); box.className='summary';
    h.closest('.blk').after(box);
  }
  box.innerHTML='<span class="thinking">queued for your Claude window</span>';
  syncTOC();
  fetch('/ask',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:CURRENT,kind:'summary',section:name,
      question:`Summarise the section "${name}" of this paper: what it establishes, `
              +`the mechanism, and any assumption it quietly relies on. `
              +`3-5 sentences, no preamble.`})})
   .then(r=>r.json()).then(({job})=>{
     jobCards.set(job,box); refreshQueue();
     streamJob(job,txt=>{
       box.innerHTML=md(txt); MathJax.typesetPromise([box]);
       jobCards.delete(job); refreshQueue();
     },msg=>{box.innerHTML=`<span class="thinking">${esc(msg)}</span>`;});
   });
}

/* ---- figure zoom ---- */
let lbScale=1;
document.addEventListener('click',e=>{
  if(e.target.tagName==='IMG'&&e.target.closest('.panels')){
    lbScale=1;
    $('lbimg').src=e.target.src; $('lbimg').style.transform='scale(1)';
    $('lightbox').style.display='flex'; $('lbhint').style.display='block';
  }
});
$('lightbox').onclick=()=>{$('lightbox').style.display='none';$('lbhint').style.display='none';};
$('lightbox').addEventListener('wheel',e=>{
  e.preventDefault();
  lbScale=Math.min(8,Math.max(1,lbScale*(e.deltaY<0?1.15:0.87)));
  $('lbimg').style.transform=`scale(${lbScale})`;
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='Escape'){$('lightbox').style.display='none';$('lbhint').style.display='none';}
});

function endSession(){
  if(!confirm('Hand back to your Claude window? You can keep reading after.')) return;
  fetch('/done',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({id:CURRENT})}).then(()=>{
    const b=$('endbtn'); b.textContent='handed over ✓'; b.disabled=true;
    $('log').insertAdjacentHTML('beforeend',
      '<div class="msg"><div class="who">Session</div><div class="answer">'
      +'Handed back to your Claude window \u2014 it has the transcript, your notes '
      +'and the quizzes. Go build.</div></div>');
    $('log').scrollTop=$('log').scrollHeight;
  });
}

let fs=+(localStorage.getItem('pd-fs')||17);
function applyFS(){$('paper').style.fontSize=fs+'px';localStorage.setItem('pd-fs',fs);}
function zoomText(d){fs=Math.min(26,Math.max(13,fs+d));applyFS();}
applyFS();

/* ---- resizable split ---- */
let drag=false;
$('grip').addEventListener('mousedown',()=>{drag=true;document.body.style.userSelect='none';});
addEventListener('mouseup',()=>{drag=false;document.body.style.userSelect='';});
addEventListener('mousemove',e=>{
  if(!drag) return;
  const w=Math.min(520,Math.max(280,innerWidth-e.clientX));
  $('side').style.flexBasis=w+'px';
});
